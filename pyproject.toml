[project]
name = "book"
version = "0.1.0"
description = "FastAPI Backend mit Layered Architecture (DDD) und SQLAlchemy 2.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn==0.47.0",
    "sqlalchemy==2.0.49",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "loguru>=0.7.3",
    "faker>=37.1.0",
]

[project.scripts]
book = "book.main:main"

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # Pyupgrade (Moderne Python-Syntax)
    "B",    # Flake8-Bugbear (Typische Bugs finden)
    "SIM",  # Flake8-Simplify (Code-Vereinfachungen)
    "D",    # Pydocstyle (Docstrings erzwingen)
    "FAST", # FastAPI-spezifische Best-Practices
    "PT",   # Pytest-spezifische Best-Practices
]
ignore = [
    "D104", # Missing docstring in public package (__init__.py)
    "D203", # 1 blank line required before class docstring (kollidiert mit D211)
    "D212", # Multi-line docstring summary should start at the first line (kollidiert mit D213)
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.15.14", "pytest>=9.0.3", "httpx>=0.28.1", "ty>=0.0.38"]
